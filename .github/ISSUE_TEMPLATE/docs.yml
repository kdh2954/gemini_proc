name: 문서화 (Documentation)
description: 문서 추가/수정이 필요한 내용을 작성합니다
labels: ["type: docs"]
body:
  - type: textarea
    id: description
    attributes:
      label: 설명
      description: 어떤 문서를 추가/수정해야 하는지 설명해주세요
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 개발 영역
      options:
        - frontend
        - backend
    validations:
      required: false
