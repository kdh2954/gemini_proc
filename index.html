<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/gemini_proc/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>매일외국어 - 하루 10개 상황회화</title>
    <meta
      name="description"
      content="Gemini API로 매일 새로운 10개의 상황회화를 생성해 학습하는 앱 모음 (영어, 중국어, 일본어)"
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f8fafc;
        --card-bg: #ffffff;
        --border: #e2e8f0;
        --text: #0f172a;
        --text-muted: #64748b;
        --accent: #7c3aed;
        --accent-hover: #6d28d9;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #020617;
          --card-bg: #0f172a;
          --border: #1e293b;
          --text: #f8fafc;
          --text-muted: #94a3b8;
          --accent: #a78bfa;
          --accent-hover: #c4b5fd;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--bg);
        color: var(--text);
        font-family:
          system-ui,
          'Segoe UI',
          Roboto,
          'Apple SD Gothic Neo',
          'Noto Sans KR',
          sans-serif;
        padding: 16px;
      }
      main {
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .emoji {
        font-size: 40px;
      }
      h1 {
        font-size: 24px;
        margin: 8px 0 4px;
      }
      p.lead {
        color: var(--text-muted);
        font-size: 14px;
        margin: 0 0 28px;
      }
      .cards {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      a.card {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 16px 18px;
        border-radius: 16px;
        border: 1px solid var(--border);
        background: var(--card-bg);
        text-decoration: none;
        color: var(--text);
        text-align: left;
        transition:
          transform 0.15s ease,
          border-color 0.15s ease;
      }
      a.card:hover {
        border-color: var(--accent);
        transform: translateY(-2px);
      }
      a.card .flag {
        font-size: 28px;
        flex-shrink: 0;
      }
      a.card .title {
        font-weight: 700;
        font-size: 16px;
      }
      a.card .desc {
        font-size: 13px;
        color: var(--text-muted);
        margin-top: 2px;
      }
      a.card .arrow {
        margin-left: auto;
        color: var(--accent);
        font-weight: 700;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="emoji">🗣️</div>
      <h1>매일외국어</h1>
      <p class="lead">하루 10개 상황회화로 매일 외국어 공부하기. 원하는 언어를 선택하세요.</p>
      <div class="cards">
        <a class="card" href="/gemini_proc/en/">
          <span class="flag">🇺🇸</span>
          <span>
            <div class="title">매일영어</div>
            <div class="desc">영어 상황회화 학습</div>
          </span>
          <span class="arrow">→</span>
        </a>
        <a class="card" href="/gemini_proc/zh/">
          <span class="flag">🇨🇳</span>
          <span>
            <div class="title">매일중국어</div>
            <div class="desc">중국어 상황회화 + 병음 학습</div>
          </span>
          <span class="arrow">→</span>
        </a>
        <a class="card" href="/gemini_proc/ja/">
          <span class="flag">🇯🇵</span>
          <span>
            <div class="title">매일일본어</div>
            <div class="desc">일본어 상황회화 + 히라가나 읽는 법 학습</div>
          </span>
          <span class="arrow">→</span>
        </a>
      </div>
    </main>
  </body>
</html>
